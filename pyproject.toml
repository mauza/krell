[project]
name = "krell"
version = "0.1.0"
description = "Krell Backend - Self-hosted RAG server for voice AI companion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "aiosqlite==0.19.0",
    "openai>=1.12.0", # Updated for httpx compatibility
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "pyyaml==6.0.1",
    "numpy==2.0.2",
    "aiohttp>=3.10.5,<3.12",  # Constrained by moshi dependency
    "librosa>=0.10.0", # Audio processing for TTS
    "moshi>=0.2.6", # For Kyutai TTS PyTorch inference
    "torch>=2.0.0", # PyTorch for moshi/kyutai TTS
    "intel-extension-for-pytorch>=2.8.0; platform_system != 'Darwin'", # Intel GPU (XPU) support
    "httpx>=0.28.1",
    "cryptography>=43.0.0", # For settings encryption
    "pytest>=8.0.0", # For testing
    "pytest-asyncio>=0.23.0", # For async test support
    "strands-agents[ollama]>=1.19.0", # Strands agent framework with Ollama support
    "watchdog>=4.0.0", # File system watching for hot reload
    "jinja2>=3.1.0", # For dashboard templates
    "pytz>=2025.2",
    "requests>=2.28.0",
    "websockets>=15.0.1",
    "bcrypt>=4.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
