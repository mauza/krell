[project]
name = "krell"
version = "0.1.0"
description = "Krell Backend - Self-hosted RAG server for voice AI companion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "aiosqlite==0.19.0",
    "openai>=1.12.0", # Updated for httpx compatibility
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "pyyaml==6.0.1",
    "numpy==2.0.2",
    "aiohttp>=3.10.5,<3.12",  # Constrained by moshi dependency
    "librosa>=0.10.0", # Audio processing for TTS
    "moshi>=0.2.6", # For Kyutai TTS PyTorch inference
    "torch>=2.0.0", # PyTorch for moshi/kyutai TTS
    "intel-extension-for-pytorch>=2.8.0; platform_system != 'Darwin'", # Intel GPU (XPU) support
    "huggingface-hub>=0.19.0", # For downloading Kyutai models from HuggingFace
    "httpx>=0.28.1",
    "cryptography>=43.0.0", # For settings encryption
    "pytest>=8.0.0", # For testing
    "pytest-asyncio>=0.23.0", # For async test support
    "strands-agents[ollama]>=1.19.0", # Strands agent framework with Ollama support
    "watchdog>=4.0.0", # File system watching for hot reload
    "jinja2>=3.1.0", # For dashboard templates
    "pytz>=2025.2",
    "requests>=2.28.0",
    "websockets>=15.0.1",
    "bcrypt>=4.0.0",
    # New dependencies for unmute architecture patterns
    "prometheus-client>=0.19.0",  # Prometheus metrics
    "msgpack>=1.0.0",  # Binary protocol for efficient streaming
    "aiofiles>=23.0.0",  # Async file I/O for event recording
    "redis>=5.0.0",  # Optional Redis cache support
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.350",  # Type checking
]
opus = [
    "opuslib>=3.0.1",  # Opus audio codec for low-latency streaming (8x compression)
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
# Start with basic mode, gradually increase to strict
typeCheckingMode = "basic"
pythonVersion = "3.10"
include = ["core", "api", "services", "plugins", "database"]
exclude = ["**/__pycache__", "**/node_modules", ".git", "venv", ".venv"]
# Gradually enable stricter checks
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
